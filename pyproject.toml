[project]
name = "local-llm"
version = "0.1.0"
description = "Local LLMs on MLX: a private life-coach (Fable-5 9B), a small abliterated chat model (Josie), and a dotfiles tool-calling fine-tune"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.31.3",
    "hf-transfer>=0.1.9",
    "httpx>=0.28.1",
    "ddgs>=9.14.4",
    "trafilatura>=2.2.0",
    "readability-lxml>=0.8.4.1",
    "html2text>=2025.4.15",
]

[project.scripts]
search = "search_entry:main"


[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["projects/dotfiles-agent", "projects/search"]
testpaths = ["projects/dotfiles-agent/tests", "projects/search/tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["search_entry.py"]

